[project]
name = "notification-service"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.6.2",
    "aioboto3>=15.5.0",
    "motor>=3.7.1",
    "pydantic-settings>=2.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff",
    "mypy"
]

[tool.mypy]
ignore_missing_imports = true